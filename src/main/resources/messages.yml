# ┌──────────────────────────────────────────────────────────────┐
# │                       Lobby · messages                       │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘
#
#  Text uses MiniMessage: https://docs.advntr.dev/minimessage/format
#  Leave a chat message empty ("") to turn it off.
#
#  Theme tags work everywhere in this file:
#    <primary> <secondary> <accent> <muted> <good> <bad>
#    <brand>text</brand>   - the theme gradient
#    <prefix>              - the prefix below
#
#  Resource packs can turn symbols into images. If a symbol shows up as
#  a picture, your pack uses it: replace it here.

# Do not change. When a plugin update ships new text, your old file is
# saved as messages.yml.old and replaced.
messages-version: 1

theme:
  primary: "#B266FF"
  secondary: "#E3C4FF"
  accent: "#FF7BE5"
  muted: "#9C8DB8"
  good: "#9BFFC4"
  bad: "#FF7590"
  gradient: ["#8E2DE2", "#E58BFF"]

prefix: "<brand><bold>Lobby</bold></brand> <dark_gray>»</dark_gray> "

format:
  # Font for everything players see: chat, the scoreboard, item names.
  #   small-caps - tiny text: "Lobby" shows as "ʟᴏʙʙʏ" (player names always stay normal)
  #   normal     - regular text
  # Write the text in this file normally; the plugin converts it as it's shown.
  font: small-caps


# ── Scoreboard ──────────────────────────────────────────────────
# Up to 15 lines, top to bottom. There are no numbers on the right.
# Tags you can use:
#   <online:NAME>  players on a proxy server (names from config.yml), e.g. <online:survival>
#   <online:all>   players on the whole network
#   <here>         players on this server
#   <player>       the viewer's name
#   <date> <time>  today's date and the time
# Start a line with <center> to center it on the scoreboard.
# PlaceholderAPI placeholders (%...%) also work when it's installed.


# ── Mystery Boxes ───────────────────────────────────────────────
# <stars> the box's stars (★★★ in gold, the rest dim), <star-count> as a number.
# <reward> what was found, <rarity> its rarity, <dust> Mystery Dust.
mystery:
  disabled: "<prefix><bad>Mystery Boxes aren't open right now."
  reloaded: "<prefix><good>Reloaded the Mystery Boxes and Collectibles."
  glow-name: "<#FFE680>Glow"
  dust-name: "<#FFD27F><amount> <white><font:fractal:lobby>\uF024</font></white>"
  dust: "<prefix><secondary>Dust <white><font:fractal:lobby>\uF024</font></white><secondary>: <#FFD27F><dust> <dark_gray>· <secondary>Boxes <white><font:fractal:lobby>\uF025</font></white><secondary>: <primary><boxes> <dark_gray>▸ <white>/mysterybox"
  received: "<prefix><secondary>You got <white><amount></white> <stars> <secondary>Mystery Box(es)! <dark_gray>▸ <white>/mysterybox"
  craft-short: "<prefix><bad>You need <white><need></white> more <white><font:fractal:lobby>\uF024</font></white> for a <stars> <bad>box."
  crafted: "<prefix><secondary>Crafted a <stars> <secondary>Mystery Box for <#FFD27F><cost></#FFD27F> <white><font:fractal:lobby>\uF024</font></white><secondary>."
  already-opening: "<prefix><muted>Your box is still opening!"
  vault-only: "<prefix><bad>Boxes open at a Mystery Vault. <muted>Go to one and right-click it."
  multi-locked: "<prefix><bad>Opening many boxes at once is a donor perk."
  craft-locked: "<prefix><bad>Crafting <stars> <bad>boxes is a donor perk."
  # Opening many boxes at once (lobby.mystery.multi): a summary instead of the show
  summary:
    header: "<prefix><#FFD27F><bold>Opened <count> Mystery Box(es)!</bold></#FFD27F> <muted>(<white><new></white> new)"
    new-line: " <dark_gray>▪ <rarity> <dark_gray>• <white><reward> <#9BFFC4>NEW"
    dupe-line: " <dark_gray>▪ <rarity> <dark_gray>• <white><reward> <dark_gray>x<times> <muted>(had it: dust)"
    dust-line: " <dark_gray>▪ <rarity> <dark_gray>• <white><reward> <dark_gray>x<times>"
    footer: " <#FFD27F>+<dust> <white><font:fractal:lobby>\uF024</font></white> <muted>(<white><total></white> now)"
  # What the player is told when the box bursts
  found: "<prefix><secondary>You found <reward> <dark_gray>(<rarity><dark_gray>)</dark_gray><secondary>! <#9BFFC4>It's yours now."
  found-duplicate: "<prefix><secondary>You found <reward> <dark_gray>(<rarity><dark_gray>)</dark_gray><secondary>, which you already have: <#FFD27F>+<dust> <white><font:fractal:lobby>\uF024</font></white>"
  found-dust: "<prefix><secondary>You found <#FFD27F><dust></#FFD27F> <white><font:fractal:lobby>\uF024</font></white><secondary>!"
  # Everyone sees this for rare finds (mystery-boxes.announce in config.yml)
  announce: "<prefix><white><player></white> <secondary>found <reward> <dark_gray>(<rarity><dark_gray>)</dark_gray> <secondary>in a <stars> <secondary>Mystery Box!"
  # Admin commands
  unknown-player: "<prefix><bad>Nobody called <white><input></white> has been in the lobby."
  given: "<prefix><good>Gave <white><player></white> <white><amount></white> <stars> <good>Mystery Box(es)."
  dust-given: "<prefix><good>Gave <white><player></white> <white><amount></white> <white><font:fractal:lobby>\uF024</font></white>. <muted>They have <white><dust></white> now."
  reset: "<prefix><secondary>Took away <white><player></white>'s boxes, dust and found cosmetics."
  # The hologram over the prize while a box opens. The rarity line can be animated (like holograms).
  opening:
    rarity:
      common: "<#ANIM:shimmer:#C9B8EE,#FFFFFF>&lᴄᴏᴍᴍᴏɴ</#ANIM>"
      uncommon: "<#ANIM:shimmer:#7FE39A,#E3FFE9>&lᴜɴᴄᴏᴍᴍᴏɴ</#ANIM>"
      rare: "<#ANIM:shimmer:#7FA8FF,#E3EBFF>&lʀᴀʀᴇ</#ANIM>"
      epic: "<#ANIM:shimmer:#C77DFF,#FFB8F5>&lᴇᴘɪᴄ</#ANIM>"
      legendary: "<#ANIM:shimmer:#FFD27F,#FFFFFF>&lʟᴇɢᴇɴᴅᴀʀʏ</#ANIM>"
    reward: "<white><reward>"
    new: "<#9BFFC4>ɴᴇᴡ!"
    duplicate: "<#B8A9D9>ᴀʟʀᴇᴀᴅʏ ᴏᴡɴᴇᴅ <dark_gray>• <#FFD27F>+<dust> ᴅᴜꜱᴛ"
    dust: "<#FFD27F>+<dust> ᴍʏꜱᴛᴇʀʏ ᴅᴜꜱᴛ"
    opened-by: "<dark_gray><stars> <#8C7BB0>ʙʏ <white><player>"
  vault:
    # Over the vault. %lobby_boxes% and %lobby_dust% are each viewer's own.
    hologram:
      - "<#ANIM:shimmer:#B266FF,#FFD27F>&lᴍʏꜱᴛᴇʀʏ ᴠᴀᴜʟᴛ</#ANIM>"
      - "&#E8DDFFʙᴏxᴇꜱ <white><font:fractal:lobby>\uF025</font></white>&#E8DDFF: &l%lobby_boxes_flash%"
      - "&#C9A86Aᴅᴜꜱᴛ <white><font:fractal:lobby>\uF024</font></white>&#C9A86A: &#FFD27F%lobby_dust%"
      - "<white><font:fractal:lobby>\uF011</font></white> <#ANIM:wave:&#C9B8EE,&#FFFFFF>ᴛᴏ ᴠɪᴇᴡ</#ANIM>"
    added: "<prefix><good>Added a Mystery Vault here. <muted>Players stand on the side you're facing. (<white><count></white> now)"
    removed: "<prefix><secondary>Removed that Mystery Vault. <muted>(<white><count></white> left)"
    none-near: "<prefix><bad>There's no Mystery Vault within 6 blocks."
    list-header: "<prefix><secondary>Mystery Vaults: <white><count>"
    list-entry: " <dark_gray>▪ <white>#<number></white> <muted><world> <white><x> <y> <z>"
    list-empty: "<prefix><muted>No Mystery Vaults yet. <dark_gray>▸ <white>/mysterybox vault add"
    too-far: "<prefix><bad>Open your boxes at the Mystery Vault."
    busy: "<prefix><muted><white><player></white> is opening a box. One moment!"
  menu:
    title: "<brand><bold>Mystery Vault</bold></brand>"
    stash:
      name: "<#FFD27F>Your Stash"
      lore:
        - "<muted>Dust <white><font:fractal:lobby>\uF024</font></white>: <#FFD27F><dust>"
        - "<muted>Boxes: <white><boxes>"
        - "<muted>Opened: <white><opened>"
    # Each box is different: what it can give is listed under it.
    box:
      name: "<stars> <white>Mystery Box"
      lore:
        - "<muted>Can contain:"
      rarity: " <rarity> <dark_gray>(<chance>%)"
      prize: "   <dark_gray>▪ <reward>"
      open-hint:
        - "<accent><left-click></accent> <muted>to open it"
      open-hint-multi:
        - "<accent><left-click></accent> <muted>to open it"
        - "<accent><shift><left-click></accent> <muted>to open all <white><count></white> <stars>"
      go-to-vault:
        - "<muted>Open it at a Mystery Vault."
    empty:
      name: "<muted>No boxes yet"
      lore:
        - "<muted>Get them from games, votes and"
        - "<muted>the store, or craft them."
    previous:
      name: "<secondary>← Page <page>"
      lore: []
    next:
      name: "<secondary>Page <page> →"
      lore: []
    no-previous:
      name: "<dark_gray>← No page before"
      lore: []
    no-next:
      name: "<dark_gray>No more pages →"
      lore: []
    craft-button:
      name: "<secondary>Craft Boxes"
      lore:
        - "<muted>Make boxes from <white><font:fractal:lobby>\uF024</font></white>."
        - "<muted>You have <#FFD27F><dust></#FFD27F><muted>."
        - ""
        - "<accent><left-click></accent> <muted>to craft"
    open-all:
      name: "<#FFD27F>Open Everything"
      lore:
        - "<muted>Open all <white><boxes></white> <muted>boxes at once:"
        - "<muted>no show, just a list of what"
        - "<muted>you got."
        - ""
        - "<accent><left-click></accent> <muted>to open all"
    open-all-one:
      name: "<dark_gray>Open Everything"
      lore:
        - "<muted>Open all your boxes at once:"
        - "<muted>no show, just a list of what"
        - "<muted>you got."
        - ""
        - "<muted>You have just one box:"
        - "<muted>click it above to open it."
    open-all-none:
      name: "<dark_gray>Open Everything"
      lore:
        - "<muted>Open all your boxes at once:"
        - "<muted>no show, just a list of what"
        - "<muted>you got."
        - ""
        - "<bad>No boxes to open"
    open-all-locked:
      name: "<dark_gray>Open Everything"
      lore:
        - "<muted>Open every box at once."
        - "<bad>Donor perk"
  # What the "Are you sure?" menu shows before opening or crafting boxes. <stars> <count> <boxes> <cost> <dust>
  confirm:
    craft:
      name: "<white>Craft a <stars> <white>Mystery Box?"
      lore:
        - "<muted>Costs <#FFD27F><cost> <white><font:fractal:lobby>\uF024</font></white>"
        - "<muted>You have <#FFD27F><dust>"
    open:
      name: "<white>Open a <stars> <white>Mystery Box?"
      lore: []
    open-kind:
      name: "<white>Open all <count> <stars> <white>boxes?"
      lore:
        - "<muted>No show, just a list of what you got."
    open-all:
      name: "<white>Open all <boxes> boxes?"
      lore:
        - "<muted>No show, just a list of what you got."
  craft-menu:
    title: "<brand><bold>Craft Boxes</bold></brand>"
    craft:
      name: "<secondary>Craft a <stars> <secondary>Box"
      lore:
        - "<muted>Costs <#FFD27F><cost> <white><font:fractal:lobby>\uF024</font></white>"
        - ""
        - "<accent><left-click></accent> <muted>to craft"
    short:
      name: "<dark_gray>Craft a <stars> <dark_gray>Box"
      lore:
        - "<muted>Costs <#FFD27F><cost> <white><font:fractal:lobby>\uF024</font></white>"
        - "<bad>You need <white><need></white> more"
    locked:
      name: "<dark_gray>Craft a <stars> <dark_gray>Box"
      lore:
        - "<muted>Costs <#FFD27F><cost> <white><font:fractal:lobby>\uF024</font></white>"
        - "<bad>Donor perk"
    back:
      name: "<secondary>← Back"
      lore:
        - "<muted>Back to your boxes."


# ── Collectibles ────────────────────────────────────────────────
# <name> the collectible (in its rarity's colour), <rarity>, <description>,
# <season>, <price> in Mystery Dust, <need> dust still needed.
collectibles:
  title: "<brand><bold>Collectibles</bold></brand>"
  join-item:
    name: "<primary>Collectibles"
    lore:
      - "<muted>Hats, suits, gadgets, cloaks,"
      - "<muted>emotes and gestures: wear them,"
      - "<muted>play with them, show them off."
      - ""
      - "<muted>Unlocked: <white><found></white><dark_gray>/<total>"
      - "<muted>Dust <white><font:fractal:lobby>\uF024</font></white>: <#FFD27F><dust>"
      - "<muted>Mystery Boxes: <white><boxes>"
      - ""
      - "<accent><right-click></accent> <muted>to open"
  worn-name: "<name>"
  stash:
    name: "<#FFD27F>Your Collection"
    lore:
      - "<muted>Unlocked: <white><found></white><dark_gray>/<total>"
      - "<muted>Dust <white><font:fractal:lobby>\uF024</font></white>: <#FFD27F><dust>"
      - "<muted>Mystery Boxes: <white><boxes>"
      - ""
      - "<white>How to get <white><font:fractal:lobby>\uF024</font></white>:"
      - "<dark_gray> ▪ <muted>Prizes from Mystery Boxes"
      - "<dark_gray> ▪ <muted>Prizes you already have turn"
      - "<muted>   into dust"
      - ""
      - "<white>What it's for:"
      - "<dark_gray> ▪ <muted>Buying collectibles here"
      - "<dark_gray> ▪ <muted>Crafting boxes at a Mystery Vault"
  category:
    hats:
      name: "<primary>Hats"
      single: "Hat"
      title: "<brand><bold>Hats</bold></brand>"
      lore:
        - "<muted>Something for your head."
    suits:
      name: "<primary>Suits"
      single: "Suit"
      title: "<brand><bold>Suits</bold></brand>"
      lore:
        - "<muted>Unlocked piece by piece. Wear the"
        - "<muted>whole set for a special bonus!"
    gadgets:
      name: "<primary>Gadgets"
      single: "Gadget"
      title: "<brand><bold>Gadgets</bold></brand>"
      lore:
        - "<muted>Fun things to use in your hotbar."
    cloaks:
      name: "<primary>Cloaks"
      single: "Cloak"
      title: "<brand><bold>Cloaks</bold></brand>"
      lore:
        - "<muted>Halos, wings and auras that"
        - "<muted>follow you around."
    emotes:
      name: "<primary>Emotes"
      single: "Emote"
      title: "<brand><bold>Emotes</bold></brand>"
      lore:
        - "<muted>A big emoji over your head."
        - "<muted>Equip one: it goes in your hotbar."
    gestures:
      name: "<primary>Gestures"
      single: "Gesture"
      title: "<brand><bold>Gestures</bold></brand>"
      lore:
        - "<muted>Your double waves, claps,"
        - "<muted>spins and more."
  # Under each category button. <found> <total> <wearing>
  category-footer:
    - ""
    - "<muted>Unlocked: <white><found></white><dark_gray>/<total>"
    - "<wearing>"
    - ""
    - "<accent><left-click></accent> <muted>to look"
  category-footer-action:
    - ""
    - "<muted>Unlocked: <white><found></white><dark_gray>/<total>"
    - ""
    - "<accent><left-click></accent> <muted>to look"
  wearing: "<muted>Wearing: <name>"
  wearing-nothing: "<muted>Wearing: <dark_gray>nothing"
  wearing-suit: "<muted>Wearing: <set> <dark_gray>(<white><count></white>/4)<more>"
  equipped-line: "<muted>Equipped: <name>"
  equipped-nothing: "<muted>Equipped: <dark_gray>nothing"
  trails:
    name: "<primary>Trails"
    lore:
      - "<muted>Particles behind you as you walk."
      - ""
      - "<accent><left-click></accent> <muted>to pick one"
  chat-colours:
    name: "<primary>Chat Colours"
    lore:
      - "<muted>The colour of your chat messages."
      - ""
      - "<accent><left-click></accent> <muted>to pick one"
  # Searching every collectible by name, typed in chat. <query>
  search:
    name: "<primary>Search"
    lore:
      - "<muted>Find a collectible by name."
      - ""
      - "<accent><left-click></accent> <muted>to type it in chat"
  search-prompt: "<prefix><secondary>Type what you're looking for in chat. <muted>(or <white>cancel</white>)"
  search-cancelled: "<prefix><muted>Search cancelled."
  search-title: "<brand><bold>Search</bold></brand> <dark_gray>\"<query>\""
  search-none:
    name: "<bad>Nothing found"
    lore:
      - "<muted>No collectible is called"
      - "<muted>anything like <white><query><muted>."
  take-off-all:
    name: "<bad>Take Everything Off"
    lore:
      - "<muted>Hat, suit pieces, gadget and cloak."
      - ""
      - "<accent><left-click></accent> <muted>to take it all off"
  # The Sort button at the bottom right of a category page. <mode>
  sort:
    name: "<primary>Sort: <white><mode>"
    lore:
      - "<muted>What this page shows."
      - ""
    option: "<dark_gray>  <muted><mode>"
    option-selected: "<accent>» <white><mode>"
    hint:
      - ""
      - "<accent><left-click></accent> <muted>for the next"
      - "<accent><right-click></accent> <muted>to go back"
    modes:
      all: "Everything"
      unlocked: "Unlocked"
      locked: "Locked"
      purchasable: "Can buy now"
      rarity: "Rarest first"
      seasonal: "Seasonal"
  # The bottom slot of a category page: what's on now, or (with nothing on) the hanger.
  take-off:
    name: "<dark_gray>Take Off"
    lore:
      - "<muted>No <category> on right now."
  take-off-worn:
    name: "<name>"
    lore:
      - "<muted>On right now."
      - ""
      - "<accent><left-click></accent> <muted>to take it off"
  # What the "Are you sure?" menu shows before buying with dust or taking things off. <name> <price> <dust>
  confirm:
    buy:
      name: "<white>Buy <name><white>?"
      lore:
        - "<muted>Costs <#FFD27F><price> <white><font:fractal:lobby>\uF024</font></white>"
        - "<muted>You have <#FFD27F><dust>"
    take-off:
      name: "<white>Take off <name><white>?"
      lore: []
    take-off-all:
      name: "<white>Take everything off?"
      lore:
        - "<muted>Hat, suit pieces, gadget and cloak."
  back:
    name: "<secondary>← Back"
    lore:
      - "<muted>Back to your Collectibles."
  previous:
    name: "<secondary>← Page <page>"
    lore: []
  next:
    name: "<secondary>Page <page> →"
    lore: []
  no-previous:
    name: "<dark_gray>← No page before"
    lore: []
  no-next:
    name: "<dark_gray>No more pages →"
    lore: []
  # One suit's own page (right-click a suit)
  suit-page:
    title: "<brand><bold><set></bold></brand>"
    back:
      name: "<secondary>← Back"
      lore:
        - "<muted>Back to all the suits."
  empty:
    name: "<dark_gray>Nothing here yet"
    lore:
      - "<muted>Check back soon!"
  season:
    normal: "<white>All Year"
    summer: "<#FFC83D>Summer"
    holiday: "<#E05A5A>Holiday"
    easter: "<#F2A8D0>Easter"
    halloween: "<#FF8A1F>Halloween"
  tab-chosen:
    - "<#9BFFC4>Showing now"
  tab-in-season:
    - "<muted>In season!"
    - "<accent><left-click></accent> <muted>to look"
  tab-out-of-season:
    - "<muted>Out of season: found and"
    - "<muted>sold during its season."
    - "<accent><left-click></accent> <muted>to look"
  entry:
    name: "<name>"
    locked-name: "<dark_gray><name>"
    lore:
      - "<rarity> <dark_gray>• <season>"
      - "<muted><description>"
    # Under a suit piece. <set> <count> (pieces worn) <ability> <bonus> <how>
    suit:
      - ""
      - "<muted>Part of the <set><muted>: <white><count></white><dark_gray>/4 worn"
      - "<#FFD27F>Full set: <white><ability>"
    worn:
      - "<#9BFFC4>✔ Wearing"
      - "<accent><left-click></accent> <muted>to take off"
    equip:
      - "<accent><left-click></accent> <muted>to wear"
    equipped:
      - "<#9BFFC4>✔ Equipped"
      - "<accent><left-click></accent> <muted>to unequip"
    equip-gadget:
      - "<accent><left-click></accent> <muted>to equip"
    use:
      - "<accent><left-click></accent> <muted>to do it"
    buy:
      - "<muted>Find it in Mystery Boxes, or"
      - "<accent><left-click></accent> <muted>to buy for <#FFD27F><price> <white><font:fractal:lobby>\uF024</font></white>"
    cant-afford:
      - "<muted>Find it in Mystery Boxes, or"
      - "<muted>buy for <#FFD27F><price> <white><font:fractal:lobby>\uF024</font></white>"
      - "<bad>You need <white><need></white> more"
    out-of-season:
      - "<muted>Out of season: only found in"
      - "<muted>Mystery Boxes during <season><muted>."
    boxes-only:
      - "<muted>Seasonal: only found in Mystery"
      - "<muted>Boxes (it can't be crafted)."
  # A whole suit, next to its four pieces. <set> <found> <count> <ability> <bonus> <how> <rarity>
  set:
    name: "<set>"
    lore:
      - "<rarity>"
      - "<muted>Pieces unlocked: <white><found></white><dark_gray>/4"
      - "<muted>Wearing: <white><count></white><dark_gray>/4"
      - ""
      - "<#FFD27F>Full set bonus: <white><ability>"
      - "<muted><bonus>"
      - "<dark_gray><how>"
    wear:
      - "<accent><left-click></accent> <muted>to wear every piece you have"
    worn:
      - "<#9BFFC4>✔ Wearing"
      - "<accent><left-click></accent> <muted>to take it off"
    none:
      - "<muted>Find its pieces in Mystery Boxes."
    pieces-hint:
      - "<accent><right-click></accent> <muted>to see its pieces"
  # What you see when you hover over something you're wearing.
  worn:
    name: "<name>"
    lore:
      - "<rarity> <dark_gray>• <season>"
      - "<muted><description>"
    set:
      - ""
      - "<set> <dark_gray>(<white><count></white>/4)"
      - "<dark_gray>Full set bonus: <gray><ability>"
      - "<dark_gray><bonus>"
    set-complete:
