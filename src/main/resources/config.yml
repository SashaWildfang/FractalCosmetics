#
#  Text and colours are in messages.yml. The Collectibles hotbar item's
#  slot is in FractalLobby's config.yml (join-items.collectibles).
#  Apply changes with /mysterybox reload.


# ── Mystery Boxes ───────────────────────────────────────────────
# Boxes of 1 to 5 stars that give a random cosmetic (a trail, a chat colour,
# a collectible) or a pile of Mystery Dust. A cosmetic the player already has turns
# into Mystery Dust, and dust crafts new boxes. Boxes are opened at the
# Mystery Vaults (stand on a spot and type /mysterybox vault add); without a
# vault they open in front of the player.
#   /mysterybox                         the Mystery Vault menu (everyone)
#   /dust                               your Mystery Dust (everyone)
#   /mysterybox give NAME STARS [AMOUNT] give boxes (console: store, votes)
#   /mysterybox dust NAME AMOUNT        give (or take, negative) Mystery Dust
#   /mysterybox reset NAME              take everything away
#   /mysterybox vault add / remove / list   place, remove or list vaults
# Found cosmetics work without the rank permission (they're saved in
# mystery-boxes.yml).
mystery-boxes:
  enabled: true
  # Mystery Dust it costs to craft a box, by stars (4 and 5 stars need
  # lobby.mystery.craft.high; lobby.mystery.multi opens many at once).
  craft-cost:
    1: 150
    2: 300
    3: 600
    4: 1200
    5: 2500
  # The chance (in %) of each rarity for a box, by stars:
  # [common, uncommon, rare, epic, legendary]. Every box draws 5 + stars
  # different prizes by these chances (shown on the box), and gives one.
  chances:
    1: [55, 30, 12, 3, 0]
    2: [40, 32, 20, 7, 1]
    3: [25, 30, 28, 13, 4]
    4: [10, 22, 35, 24, 9]
    5: [0, 10, 35, 35, 20]
  # Each rarity's name and colour, and the Mystery Dust a duplicate turns into.
  rarities:
    common:
      name: "<#C9B8EE>Common"
      color: "#C9B8EE"
      duplicate-dust: 10
    uncommon:
      name: "<#7FE39A>Uncommon"
      color: "#7FE39A"
      duplicate-dust: 18
    rare:
      name: "<#7FA8FF>Rare"
      color: "#7FA8FF"
      duplicate-dust: 25
    epic:
      name: "<#C77DFF>Epic"
      color: "#C77DFF"
      duplicate-dust: 60
    legendary:
      name: "<#FFD27F>Legendary"
      color: "#FFD27F"
      duplicate-dust: 150
  # Everyone is told when someone finds something this rare or rarer.
  announce: legendary
  # Every all-year collectible (hats, suits, gadgets, cloaks, emotes,
  # gestures) can be in boxes too, with its own rarity. Seasonal ones never
  # are: they come from Seasonal Boxes.
  include-collectibles: true
  # What else boxes can give: "type:value rarity". Types: trail:ID and
  # chatcolor:ID (from trails and chat-color above), dust:AMOUNT. Glow is a
  # rank perk (lobby.cmd.glow) and is never in boxes.
  # Cosmetics that are free for everyone are left out automatically.
  rewards:
    - "dust:20 common"
    - "dust:35 common"
    - "trail:hearts common"
    - "trail:snowflakes common"
    - "trail:sparks common"
    - "dust:45 uncommon"
    - "dust:60 rare"
    - "trail:flames rare"
    - "trail:blossom rare"
    - "trail:magic rare"
    - "chatcolor:ocean rare"
    - "dust:140 epic"
    - "trail:soul-flames epic"
    - "trail:stars epic"
    - "chatcolor:sunset epic"
    - "chatcolor:fractal epic"
    - "dust:350 legendary"
    - "trail:enchanted legendary"
    - "trail:totem legendary"
    - "chatcolor:rainbow legendary"


# ── Collectibles ────────────────────────────────────────────────
# Hats, suits, gadgets, cloaks, emotes and gestures, from the Collectibles
# join item (join-items.collectibles) or /collectibles. Found in Mystery
# Boxes or bought with Mystery Dust. Seasonal ones (Summer: Jun-Aug,
# Halloween: Oct 1-Nov 7, Holiday: Dec 1-Jan 6, Easter: Mar 15-Apr 30) only
# drop and sell in their season; found ones can be worn any time.
# Suits are found piece by piece (helmet, chestplate, leggings, boots);
# wearing all four gives the suit's bonus: a right-click with an empty hand
# on a block or the swap-hands key (F), or always on for some suits.
# Only all-year (Normal) collectibles can be crafted with Mystery Dust.
# lobby.collectibles.all gives everything (for staff to try things out).
collectibles:
  enabled: true
  # Hotbar slot (1-9) for the gadget you hold (right of the Collectibles item).
  gadget-slot: 6
  # Price in Mystery Dust, by rarity (a suit piece costs half).
  price:
    common: 100
    rare: 250
    epic: 600
    legendary: 1500
  # Seasons to treat as on right now, e.g. [halloween] for an event.
  seasons-on: []
